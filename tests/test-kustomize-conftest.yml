name: Test kustomize and conftest setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-tools: |
            kustomize
            conftest
          kustomize: '5.3.0'
          conftest: '0.50.0'
          arch-type: amd64
      - name: Assert kustomize-path output is set
        env:
          KUSTOMIZE_PATH: ${{ steps.action.outputs.kustomize-path }}
        run: |
          echo "kustomize-path: '$KUSTOMIZE_PATH'"
          if [ -z "$KUSTOMIZE_PATH" ]; then
            echo "FAIL: kustomize-path output is empty"
            exit 1
          fi
          echo "PASS: kustomize-path is set"
      - name: Assert conftest-path output is set
        env:
          CONFTEST_PATH: ${{ steps.action.outputs.conftest-path }}
        run: |
          echo "conftest-path: '$CONFTEST_PATH'"
          if [ -z "$CONFTEST_PATH" ]; then
            echo "FAIL: conftest-path output is empty"
            exit 1
          fi
          echo "PASS: conftest-path is set"
      - name: Assert kustomize binary works
        run: |
          echo "Running kustomize version"
          which kustomize || (echo "FAIL: kustomize not found in PATH"; exit 1)
          kustomize version
          echo "PASS: kustomize is functional"
      - name: Assert conftest binary works
        run: |
          echo "Running conftest --version"
          which conftest || (echo "FAIL: conftest not found in PATH"; exit 1)
          conftest --version
          echo "PASS: conftest is functional"
