name: Test multiple tools setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-tools: |
            kubectl
            yq
            kustomize
          kubectl: '1.34.1'
          yq: '4.47.2'
          kustomize: '5.7.1'
      - name: Assert kubectl-path output is set
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "kubectl-path: $KUBECTL_PATH"
          if [ -z "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path output is empty"
            exit 1
          fi
          echo "PASS: kubectl-path is set"
      - name: Assert yq-path output is set
        env:
          YQ_PATH: ${{ steps.action.outputs.yq-path }}
        run: |
          echo "yq-path: $YQ_PATH"
          if [ -z "$YQ_PATH" ]; then
            echo "FAIL: yq-path output is empty"
            exit 1
          fi
          echo "PASS: yq-path is set"
      - name: Assert kustomize-path output is set
        env:
          KUSTOMIZE_PATH: ${{ steps.action.outputs.kustomize-path }}
        run: |
          echo "kustomize-path: $KUSTOMIZE_PATH"
          if [ -z "$KUSTOMIZE_PATH" ]; then
            echo "FAIL: kustomize-path output is empty"
            exit 1
          fi
          echo "PASS: kustomize-path is set"
      - name: Assert tools not requested have empty paths
        env:
          HELM_PATH: ${{ steps.action.outputs.helm-path }}
          CONFTEST_PATH: ${{ steps.action.outputs.conftest-path }}
        run: |
          echo "helm-path: $HELM_PATH"
          echo "conftest-path: $CONFTEST_PATH"
          if [ -n "$HELM_PATH" ]; then
            echo "FAIL: helm-path should be empty when helm not in setup-tools, got: $HELM_PATH"
            exit 1
          fi
          if [ -n "$CONFTEST_PATH" ]; then
            echo "FAIL: conftest-path should be empty when conftest not in setup-tools, got: $CONFTEST_PATH"
            exit 1
          fi
          echo "PASS: non-requested tools have empty paths"
      - name: Assert yq binary works
        run: |
          VERSION=$(yq --version 2>&1)
          echo "yq version: $VERSION"
          if echo "$VERSION" | grep -q "4.47"; then
            echo "PASS: yq version matches expected 4.47.x"
          else
            echo "FAIL: yq version does not match expected 4.47.x, got: $VERSION"
            exit 1
          fi
