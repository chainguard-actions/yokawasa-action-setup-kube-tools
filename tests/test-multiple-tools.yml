name: Test multiple tools setup (helm and yq)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-tools: |
            helm
            yq
          helm: '3.19.0'
          yq: '4.47.2'
      - name: Assert helm-path output is set
        env:
          HELM_PATH: ${{ steps.action.outputs.helm-path }}
        run: |
          echo "helm-path: $HELM_PATH"
          if [ -z "$HELM_PATH" ]; then
            echo "FAIL: helm-path output is empty"
            exit 1
          fi
          echo "PASS: helm-path is set to $HELM_PATH"
      - name: Assert yq-path output is set
        env:
          YQ_PATH: ${{ steps.action.outputs.yq-path }}
        run: |
          echo "yq-path: $YQ_PATH"
          if [ -z "$YQ_PATH" ]; then
            echo "FAIL: yq-path output is empty"
            exit 1
          fi
          echo "PASS: yq-path is set to $YQ_PATH"
      - name: Assert helm binary works
        run: |
          echo "Running helm version..."
          helm version --short
          if [ $? -ne 0 ]; then
            echo "FAIL: helm version command failed"
            exit 1
          fi
          echo "PASS: helm version ran successfully"
      - name: Assert yq binary works
        run: |
          echo "Running yq version..."
          yq --version
          if [ $? -ne 0 ]; then
            echo "FAIL: yq version command failed"
            exit 1
          fi
          echo "PASS: yq version ran successfully"
      - name: Assert non-selected tools have empty paths
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
          KUSTOMIZE_PATH: ${{ steps.action.outputs.kustomize-path }}
        run: |
          echo "kubectl-path: '$KUBECTL_PATH'"
          echo "kustomize-path: '$KUSTOMIZE_PATH'"
          if [ -n "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path should be empty when not in setup-tools"
            exit 1
          fi
          if [ -n "$KUSTOMIZE_PATH" ]; then
            echo "FAIL: kustomize-path should be empty when not in setup-tools"
            exit 1
          fi
          echo "PASS: non-selected tools have empty paths"
