name: Test multiple tools setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-tools: |
            helm
            yq
          helm: '3.14.0'
          yq: '4.40.5'
          arch-type: amd64
      - name: Assert helm-path output is set
        env:
          HELM_PATH: ${{ steps.action.outputs.helm-path }}
        run: |
          echo "helm-path: '$HELM_PATH'"
          if [ -z "$HELM_PATH" ]; then
            echo "FAIL: helm-path output is empty"
            exit 1
          fi
          echo "PASS: helm-path is set"
      - name: Assert yq-path output is set
        env:
          YQ_PATH: ${{ steps.action.outputs.yq-path }}
        run: |
          echo "yq-path: '$YQ_PATH'"
          if [ -z "$YQ_PATH" ]; then
            echo "FAIL: yq-path output is empty"
            exit 1
          fi
          echo "PASS: yq-path is set"
      - name: Assert helm binary works
        run: |
          echo "Running helm version"
          which helm || (echo "FAIL: helm not found in PATH"; exit 1)
          helm version
          echo "PASS: helm is functional"
      - name: Assert yq binary works
        run: |
          echo "Running yq --version"
          which yq || (echo "FAIL: yq not found in PATH"; exit 1)
          yq --version
          echo "PASS: yq is functional"
