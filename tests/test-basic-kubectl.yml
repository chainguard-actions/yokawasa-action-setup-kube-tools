name: Test basic kubectl setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-tools: kubectl
          kubectl: '1.35.3'
      - name: Assert kubectl-path output is set
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "kubectl-path: $KUBECTL_PATH"
          if [ -z "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path output is empty"
            exit 1
          fi
          echo "PASS: kubectl-path is set to $KUBECTL_PATH"
      - name: Assert kubectl binary exists and is executable
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "Checking kubectl binary at: $KUBECTL_PATH"
          if [ ! -f "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl binary not found at $KUBECTL_PATH"
            exit 1
          fi
          if [ ! -x "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl binary is not executable"
            exit 1
          fi
          echo "PASS: kubectl binary exists and is executable"
      - name: Assert kubectl version
        run: |
          KUBECTL_VERSION=$(kubectl version --client --output=json 2>/dev/null | grep -o '"gitVersion":"[^"]*"' | head -1 | cut -d'"' -f4 || kubectl version --client 2>&1 | head -1)
          echo "kubectl version output: $KUBECTL_VERSION"
          if ! kubectl version --client 2>&1 | grep -q "1.35"; then
            echo "FAIL: expected kubectl version 1.35.x"
            exit 1
          fi
          echo "PASS: kubectl version matches expected"
      - name: Assert other tools are NOT set up
        env:
          HELM_PATH: ${{ steps.action.outputs.helm-path }}
          KUSTOMIZE_PATH: ${{ steps.action.outputs.kustomize-path }}
        run: |
          echo "helm-path: $HELM_PATH"
          echo "kustomize-path: $KUSTOMIZE_PATH"
          if [ -n "$HELM_PATH" ]; then
            echo "FAIL: helm-path should be empty when only kubectl is requested"
            exit 1
          fi
          if [ -n "$KUSTOMIZE_PATH" ]; then
            echo "FAIL: kustomize-path should be empty when only kubectl is requested"
            exit 1
          fi
          echo "PASS: other tools are not set up"
