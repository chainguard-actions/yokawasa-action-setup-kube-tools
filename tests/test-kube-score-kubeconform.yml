name: Test kube-score and kubeconform installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-tools: |
            kube-score
            kubeconform
          kube-score: '1.20.0'
          kubeconform: '0.7.0'
      - name: Assert kube-score-path output is set
        env:
          KUBE_SCORE_PATH: ${{ steps.action.outputs.kube-score-path }}
        run: |
          echo "kube-score-path: $KUBE_SCORE_PATH"
          if [ -z "$KUBE_SCORE_PATH" ]; then
            echo "FAIL: kube-score-path output is empty"
            exit 1
          fi
          echo "PASS: kube-score-path is set to $KUBE_SCORE_PATH"
      - name: Assert kube-score binary is executable
        env:
          KUBE_SCORE_PATH: ${{ steps.action.outputs.kube-score-path }}
        run: |
          echo "Testing kube-score at: $KUBE_SCORE_PATH"
          if [ ! -x "$KUBE_SCORE_PATH" ]; then
            echo "FAIL: kube-score binary is not executable at $KUBE_SCORE_PATH"
            exit 1
          fi
          VERSION=$("$KUBE_SCORE_PATH" version 2>/dev/null || echo "unknown")
          echo "kube-score version: $VERSION"
          echo "PASS: kube-score binary is executable"
      - name: Assert kubeconform binary is in PATH
        run: |
          if ! command -v kubeconform &>/dev/null; then
            echo "FAIL: kubeconform not found in PATH"
            exit 1
          fi
          VERSION=$(kubeconform -v 2>/dev/null || echo "unknown")
          echo "kubeconform version: $VERSION"
          echo "PASS: kubeconform is available in PATH"
      - name: Assert kubectl-path is empty (not requested)
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "kubectl-path: '$KUBECTL_PATH'"
          if [ -n "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path should be empty since kubectl was not requested"
            exit 1
          fi
          echo "PASS: kubectl-path is empty as expected"
