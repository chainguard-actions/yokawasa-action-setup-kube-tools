name: Test kubeconform and kube-score setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-tools: |
            kubeconform
            kube-score
          kubeconform: '0.6.4'
          kube-score: '1.18.0'
          arch-type: amd64
      - name: Assert kube-score-path output is set
        env:
          KUBE_SCORE_PATH: ${{ steps.action.outputs.kube-score-path }}
        run: |
          echo "kube-score-path: '$KUBE_SCORE_PATH'"
          if [ -z "$KUBE_SCORE_PATH" ]; then
            echo "FAIL: kube-score-path output is empty"
            exit 1
          fi
          echo "PASS: kube-score-path is set"
      - name: Assert kubeconform binary works
        run: |
          echo "Running kubeconform -v"
          which kubeconform || (echo "FAIL: kubeconform not found in PATH"; exit 1)
          kubeconform -v
          echo "PASS: kubeconform is functional"
      - name: Assert kube-score binary works
        run: |
          echo "Running kube-score version"
          which kube-score || (echo "FAIL: kube-score not found in PATH"; exit 1)
          kube-score version
          echo "PASS: kube-score is functional"
