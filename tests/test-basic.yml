name: Test basic usage - setup kubectl and helm
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-tools: |
            kubectl
            helm
          kubectl: '1.35.3'
          helm: '3.20.1'
      - name: Assert kubectl-path output is set
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "kubectl-path: $KUBECTL_PATH"
          if [ -z "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path output is empty"
            exit 1
          fi
          echo "PASS: kubectl-path=$KUBECTL_PATH"
      - name: Assert helm-path output is set
        env:
          HELM_PATH: ${{ steps.action.outputs.helm-path }}
        run: |
          echo "helm-path: $HELM_PATH"
          if [ -z "$HELM_PATH" ]; then
            echo "FAIL: helm-path output is empty"
            exit 1
          fi
          echo "PASS: helm-path=$HELM_PATH"
      - name: Assert kubectl is executable
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "Checking kubectl at: $KUBECTL_PATH"
          if [ ! -x "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl binary is not executable at $KUBECTL_PATH"
            exit 1
          fi
          "$KUBECTL_PATH" version --client
          echo "PASS: kubectl is executable"
      - name: Assert helm is executable
        env:
          HELM_PATH: ${{ steps.action.outputs.helm-path }}
        run: |
          echo "Checking helm at: $HELM_PATH"
          if [ ! -x "$HELM_PATH" ]; then
            echo "FAIL: helm binary is not executable at $HELM_PATH"
            exit 1
          fi
          "$HELM_PATH" version
          echo "PASS: helm is executable"
