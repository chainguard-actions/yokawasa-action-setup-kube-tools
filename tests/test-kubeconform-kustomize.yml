name: Test kubeconform and kustomize setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-tools: |
            kubeconform
            kustomize
          kubeconform: '0.6.4'
          kustomize: '5.3.0'
          fail-fast: 'false'
      - name: Assert kustomize is in PATH and executable
        run: |
          echo "Checking kustomize in PATH..."
          if ! command -v kustomize &>/dev/null; then
            echo "FAIL: kustomize not found in PATH"
            exit 1
          fi
          echo "kustomize found at: $(which kustomize)"
          kustomize version 2>/dev/null || true
          echo "PASS: kustomize is in PATH"
      - name: Assert kubeconform is in PATH and executable
        run: |
          echo "Checking kubeconform in PATH..."
          if ! command -v kubeconform &>/dev/null; then
            echo "FAIL: kubeconform not found in PATH"
            exit 1
          fi
          echo "kubeconform found at: $(which kubeconform)"
          kubeconform -v 2>/dev/null || true
          echo "PASS: kubeconform is in PATH"
      - name: Assert kustomize version matches requested
        run: |
          VERSION=$(kustomize version 2>/dev/null | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1)
          echo "actual version: $VERSION"
          if [ "$VERSION" != "5.3.0" ]; then
            echo "FAIL: expected kustomize version 5.3.0, got $VERSION"
            exit 1
          fi
          echo "PASS: kustomize version matches 5.3.0"
