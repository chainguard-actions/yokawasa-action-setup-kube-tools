name: Test arch-type input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          arch-type: 'amd64'
          setup-tools: kubectl
          kubectl: '1.34.1'
      - name: Assert kubectl-path output is set when arch-type is specified
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "kubectl-path: $KUBECTL_PATH"
          if [ -z "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path output is empty when arch-type=amd64"
            exit 1
          fi
          echo "PASS: kubectl-path=$KUBECTL_PATH"
      - name: Assert kubectl binary exists at the reported path
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "Checking kubectl at: $KUBECTL_PATH"
          if [ ! -f "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl binary not found at $KUBECTL_PATH"
            exit 1
          fi
          echo "PASS: kubectl binary exists at $KUBECTL_PATH"
      - name: Assert kubectl is runnable
        run: |
          kubectl version --client --output=json | grep -q '"gitVersion"'
          echo "PASS: kubectl is runnable after arch-type=amd64 setup"
