name: Test arch-type input - explicit amd64 architecture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          arch-type: 'amd64'
          setup-tools: |
            kubectl
            yq
          kubectl: '1.34.1'
          yq: '4.47.2'
      - name: Assert kubectl-path output is set
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "kubectl-path: $KUBECTL_PATH"
          if [ -z "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path output is empty"
            exit 1
          fi
          echo "PASS: kubectl-path=$KUBECTL_PATH"
      - name: Assert yq-path output is set
        env:
          YQ_PATH: ${{ steps.action.outputs.yq-path }}
        run: |
          echo "yq-path: $YQ_PATH"
          if [ -z "$YQ_PATH" ]; then
            echo "FAIL: yq-path output is empty"
            exit 1
          fi
          echo "PASS: yq-path=$YQ_PATH"
      - name: Assert kubectl is executable
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "Running kubectl version..."
          "$KUBECTL_PATH" version --client --output=yaml
          echo "PASS: kubectl is executable"
      - name: Assert yq is executable
        env:
          YQ_PATH: ${{ steps.action.outputs.yq-path }}
        run: |
          echo "Running yq version..."
          "$YQ_PATH" --version
          echo "PASS: yq is executable"
