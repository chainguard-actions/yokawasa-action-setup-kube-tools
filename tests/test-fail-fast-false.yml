name: Test fail-fast false with invalid version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare tool cache directory
        run: mkdir -p /tmp/tool-cache
      - id: action
        uses: .
        with:
          fail-fast: 'false'
          setup-tools: |
            kubectl
          kubectl: '0.0.0-nonexistent'
        env:
          RUNNER_TOOL_CACHE: /tmp/tool-cache
      - name: Assert action completed without failing
        run: |
          echo "PASS: action completed without failing even with invalid version (fail-fast=false)"
      - name: Assert kubectl-path is empty for invalid version
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "kubectl-path: '$KUBECTL_PATH'"
          # With a bad version and fail-fast=false, the path should be empty
          # (tool was not successfully installed)
          if [ -n "$KUBECTL_PATH" ] && [ ! -f "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path is set but file does not exist: $KUBECTL_PATH"
            exit 1
          fi
          echo "PASS: kubectl-path is either empty or points to a valid file"
