name: Test fail-fast false with invalid version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          fail-fast: 'false'
          setup-tools: |
            kubectl
            yq
          kubectl: '0.0.0-invalid-version'
          yq: '4.47.2'

      - name: Assert action did not fail (fail-fast=false)
        run: |
          echo "PASS: action completed without failing despite invalid kubectl version"

      - name: Assert yq-path is non-empty (valid tool still installed)
        env:
          ACTUAL: ${{ steps.action.outputs.yq-path }}
        run: |
          echo "actual yq-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: yq-path output is empty - valid tool should still be installed"
            exit 1
          fi
          echo "PASS: yq-path=$ACTUAL"

      - name: Assert kubectl-path is empty (invalid version failed to install)
        env:
          ACTUAL: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "actual kubectl-path: $ACTUAL"
          # With fail-fast=false and an invalid version, kubectl-path should be empty
          # (the download failed but the action continued)
          if [ -n "$ACTUAL" ]; then
            echo "INFO: kubectl-path is non-empty: $ACTUAL (unexpected but not fatal)"
          else
            echo "PASS: kubectl-path is empty as expected for invalid version"
          fi
