name: Test kustomize setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-tools: kustomize
          kustomize: '5.8.1'
      - name: Assert kustomize-path output is set
        env:
          KUSTOMIZE_PATH: ${{ steps.action.outputs.kustomize-path }}
        run: |
          echo "kustomize-path: $KUSTOMIZE_PATH"
          if [ -z "$KUSTOMIZE_PATH" ]; then
            echo "FAIL: kustomize-path output is empty"
            exit 1
          fi
          echo "PASS: kustomize-path is set to $KUSTOMIZE_PATH"
      - name: Assert kustomize binary exists and is executable
        env:
          KUSTOMIZE_PATH: ${{ steps.action.outputs.kustomize-path }}
        run: |
          echo "Checking kustomize binary at: $KUSTOMIZE_PATH"
          if [ ! -f "$KUSTOMIZE_PATH" ]; then
            echo "FAIL: kustomize binary not found at $KUSTOMIZE_PATH"
            exit 1
          fi
          if [ ! -x "$KUSTOMIZE_PATH" ]; then
            echo "FAIL: kustomize binary is not executable"
            exit 1
          fi
          echo "PASS: kustomize binary exists and is executable"
      - name: Assert kustomize version
        run: |
          echo "kustomize version:"
          kustomize version
          if ! kustomize version 2>&1 | grep -q "5.8"; then
            echo "FAIL: expected kustomize version 5.8.x"
            exit 1
          fi
          echo "PASS: kustomize version matches expected"
      - name: Assert other tools are NOT set up
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
          HELM_PATH: ${{ steps.action.outputs.helm-path }}
        run: |
          echo "kubectl-path: $KUBECTL_PATH"
          echo "helm-path: $HELM_PATH"
          if [ -n "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path should be empty when only kustomize is requested"
            exit 1
          fi
          if [ -n "$HELM_PATH" ]; then
            echo "FAIL: helm-path should be empty when only kustomize is requested"
            exit 1
          fi
          echo "PASS: other tools are not set up"
