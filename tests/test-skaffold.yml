name: Test skaffold setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-tools: skaffold
          skaffold: '2.10.0'
          arch-type: amd64
      - name: Assert skaffold-path output is set
        env:
          SKAFFOLD_PATH: ${{ steps.action.outputs.skaffold-path }}
        run: |
          echo "skaffold-path: '$SKAFFOLD_PATH'"
          if [ -z "$SKAFFOLD_PATH" ]; then
            echo "FAIL: skaffold-path output is empty"
            exit 1
          fi
          echo "PASS: skaffold-path is set"
      - name: Assert skaffold binary works
        run: |
          echo "Running skaffold version"
          which skaffold || (echo "FAIL: skaffold not found in PATH"; exit 1)
          skaffold version
          echo "PASS: skaffold is functional"
