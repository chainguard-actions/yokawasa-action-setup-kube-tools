name: "action-setup-kube-tools Test"
on:
  # Schedule run: Runs at 00:00, only on Mondays (Japan Time)
  schedule:
    - cron: '0 15 * * 1' 
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'
      - 'v*'

permissions: {}

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '24.x'
    - run: |
        npm install
        npm run all
  test-all-tools-no-input:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - uses: ./
      id: setup
    - run: |
        kubectl version --client
        kustomize version
        helm version
        kubeval --version
        kubeconform -v
        conftest --version
        yq --version
        rancher --version
        tilt version
        skaffold version
        kube-score version
    - env:
        KUBECTL_PATH: ${{ steps.setup.outputs.kubectl-path }}
        KUSTOMIZE_PATH: ${{ steps.setup.outputs.kustomize-path }}
        HELM_PATH: ${{ steps.setup.outputs.helm-path }}
        KUBEVAL_PATH: ${{ steps.setup.outputs.kubeval-path }}
        KUBECONFORM_PATH: ${{ steps.setup.outputs.kubeconform-path }}
        CONFTEST_PATH: ${{ steps.setup.outputs.conftest-path }}
        YQ_PATH: ${{ steps.setup.outputs.yq-path }}
        RANCHER_PATH: ${{ steps.setup.outputs.rancher-path }}
        TILT_PATH: ${{ steps.setup.outputs.tilt-path }}
        SKAFFOLD_PATH: ${{ steps.setup.outputs.skaffold-path }}
        KUBESCORE_PATH: ${{ steps.setup.outputs.kube-score-path }}
      run: |
        "${KUBECTL_PATH}" version --client
        "${KUSTOMIZE_PATH}" version
        "${HELM_PATH}" version
        "${KUBEVAL_PATH}" --version
        "${KUBECONFORM_PATH}" -v
        "${CONFTEST_PATH}" --version
        "${YQ_PATH}" --version
        "${RANCHER_PATH}" --version
        "${TILT_PATH}" version
        "${SKAFFOLD_PATH}" version
        "${KUBESCORE_PATH}" version

  test-all-tools-with-versrion-input:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - uses: ./
      with:
        kubectl: '1.17.1'
        kustomize: '3.7.0'
        helm: '3.2.4'
        kubeval: '0.16.1'
        kubeconform: '0.5.0'
        conftest: '0.18.2'
        yq: '4.7.1'
        rancher: '2.4.10'
        tilt: '0.18.11'
        skaffold: '1.20.0'
        kube-score: '1.10.1'
      id: setup
    - run: |
        kubectl version --client
        kustomize version
        helm version
        kubeval --version
        kubeconform -v
        conftest --version
        yq --version
        rancher --version
        tilt version
        skaffold version
        kube-score version
    - env:
        KUBECTL_PATH: ${{ steps.setup.outputs.kubectl-path }}
        KUSTOMIZE_PATH: ${{ steps.setup.outputs.kustomize-path }}
        HELM_PATH: ${{ steps.setup.outputs.helm-path }}
        KUBEVAL_PATH: ${{ steps.setup.outputs.kubeval-path }}
        KUBECONFORM_PATH: ${{ steps.setup.outputs.kubeconform-path }}
        CONFTEST_PATH: ${{ steps.setup.outputs.conftest-path }}
        YQ_PATH: ${{ steps.setup.outputs.yq-path }}
        RANCHER_PATH: ${{ steps.setup.outputs.rancher-path }}
        TILT_PATH: ${{ steps.setup.outputs.tilt-path }}
        SKAFFOLD_PATH: ${{ steps.setup.outputs.skaffold-path }}
        KUBESCORE_PATH: ${{ steps.setup.outputs.kube-score-path }}
      run: |
        "${KUBECTL_PATH}" version --client
        "${KUSTOMIZE_PATH}" version
        "${HELM_PATH}" version
        "${KUBEVAL_PATH}" --version
        "${KUBECONFORM_PATH}" -v
        "${CONFTEST_PATH}" --version
        "${YQ_PATH}" --version
        "${RANCHER_PATH}" --version
        "${TILT_PATH}" version
        "${SKAFFOLD_PATH}" version
        "${KUBESCORE_PATH}" version

  test-with-some-tools-selected-and-latest:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - uses: ./
      with:
        arch-type: 'amd64'
        setup-tools: |
          kubectl
          helm
          kustomize
          skaffold
        kubectl: latest
        helm: latest
        kustomize: latest
        skaffold: latest
      id: setup
    - run: |
        kubectl version --client
        kustomize version
        helm version
        skaffold version
    - env:
        KUBECTL_PATH: ${{ steps.setup.outputs.kubectl-path }}
        KUSTOMIZE_PATH: ${{ steps.setup.outputs.kustomize-path }}
        HELM_PATH: ${{ steps.setup.outputs.helm-path }}
        KUBEVAL_PATH: ${{ steps.setup.outputs.kubeval-path }}
        KUBECONFORM_PATH: ${{ steps.setup.outputs.kubeconform-path }}
        CONFTEST_PATH: ${{ steps.setup.outputs.conftest-path }}
        YQ_PATH: ${{ steps.setup.outputs.yq-path }}
        RANCHER_PATH: ${{ steps.setup.outputs.rancher-path }}
        TILT_PATH: ${{ steps.setup.outputs.tilt-path }}
        SKAFFOLD_PATH: ${{ steps.setup.outputs.skaffold-path }}
        KUBESCORE_PATH: ${{ steps.setup.outputs.kube-score-path }}
      run: |
        if [ ! -z "${KUBECTL_PATH}" ]; then
          "${KUBECTL_PATH}" version --client
        fi
        if [ ! -z "${KUSTOMIZE_PATH}" ]; then
          "${KUSTOMIZE_PATH}" version
        fi
        if [ ! -z "${HELM_PATH}" ]; then
          "${HELM_PATH}" version
        fi
        if [ ! -z "${KUBEVAL_PATH}" ]; then
          "${KUBEVAL_PATH}" --version
        fi
        if [ ! -z "${KUBECONFORM_PATH}" ]; then
          "${KUBECONFORM_PATH}" -v
        fi
        if [ ! -z "${CONFTEST_PATH}" ]; then
          "${CONFTEST_PATH}" --version
        fi
        if [ ! -z "${YQ_PATH}" ]; then
          "${YQ_PATH}" --version
        fi
        if [ ! -z "${RANCHER_PATH}" ]; then
          "${RANCHER_PATH}" --version
        fi
        if [ ! -z "${TILT_PATH}" ]; then
          "${TILT_PATH}" version
        fi
        if [ ! -z "${SKAFFOLD_PATH}" ]; then
          "${SKAFFOLD_PATH}" version
        fi
        if [ ! -z "${KUBESCORE_PATH}" ]; then
          "${KUBESCORE_PATH}" version
        fi

  # ARM test (force ARM64 artifacts on x64 runner)
  test-force-arm64:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - uses: ./
      with:
        arch-type: 'arm64'
      id: setup
    - env:
        KUBECTL_PATH: ${{ steps.setup.outputs.kubectl-path }}
        KUSTOMIZE_PATH: ${{ steps.setup.outputs.kustomize-path }}
        HELM_PATH: ${{ steps.setup.outputs.helm-path }}
        KUBEVAL_PATH: ${{ steps.setup.outputs.kubeval-path }}
        KUBECONFORM_PATH: ${{ steps.setup.outputs.kubeconform-path }}
        CONFTEST_PATH: ${{ steps.setup.outputs.conftest-path }}
        YQ_PATH: ${{ steps.setup.outputs.yq-path }}
        RANCHER_PATH: ${{ steps.setup.outputs.rancher-path }}
        TILT_PATH: ${{ steps.setup.outputs.tilt-path }}
        SKAFFOLD_PATH: ${{ steps.setup.outputs.skaffold-path }}
        KUBESCORE_PATH: ${{ steps.setup.outputs.kube-score-path }}
      run: |
        echo "Expecting aarch64 ARM64 binaries (forced)"

        check_arch() {
          if [ -n "$1" ]; then
            file "$1" | tee /dev/stderr | grep -E "aarch64|ARM" >/dev/null
          fi
        }

        check_arch "${KUBECTL_PATH}"
        check_arch "${KUSTOMIZE_PATH}"
        check_arch "${HELM_PATH}"
        # kubeval may be empty on arm64 as unsupported
        check_arch "${KUBECONFORM_PATH}"
        check_arch "${CONFTEST_PATH}"
        check_arch "${YQ_PATH}"
        check_arch "${RANCHER_PATH}"
        check_arch "${TILT_PATH}"
        check_arch "${SKAFFOLD_PATH}"
        check_arch "${KUBESCORE_PATH}"

  # ARM64 auto-detect test (no arch-type input)
  test-arm-autodetect:
    runs-on: ubuntu-24.04-arm
    permissions: {}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Show runner arch
      env:
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        echo "runner.os=${RUNNER_OS}"
        echo "runner.arch=${RUNNER_ARCH}"
        uname -a
        uname -m
    - uses: ./
      id: setup
    - name: Verify tools execute on ARM64
      run: |
        kubectl version --client
        kustomize version
        helm version
        kubeconform -v
        conftest --version
        yq --version
        rancher --version
        tilt version
        skaffold version
        kube-score version
    - name: Verify binaries are ARM64
      env:
        KUBECTL_PATH: ${{ steps.setup.outputs.kubectl-path }}
        KUSTOMIZE_PATH: ${{ steps.setup.outputs.kustomize-path }}
        HELM_PATH: ${{ steps.setup.outputs.helm-path }}
        KUBEVAL_PATH: ${{ steps.setup.outputs.kubeval-path }}
        KUBECONFORM_PATH: ${{ steps.setup.outputs.kubeconform-path }}
        CONFTEST_PATH: ${{ steps.setup.outputs.conftest-path }}
        YQ_PATH: ${{ steps.setup.outputs.yq-path }}
        RANCHER_PATH: ${{ steps.setup.outputs.rancher-path }}
        TILT_PATH: ${{ steps.setup.outputs.tilt-path }}
        SKAFFOLD_PATH: ${{ steps.setup.outputs.skaffold-path }}
        KUBESCORE_PATH: ${{ steps.setup.outputs.kube-score-path }}
      run: |
        echo "Expecting aarch64 ARM64 binaries on ARM runner"

        check_arch() {
          if [ -n "$1" ]; then
            file "$1" | tee /dev/stderr | grep -E "aarch64|ARM" >/dev/null
          fi
        }

        check_arch "${KUBECTL_PATH}"
        check_arch "${KUSTOMIZE_PATH}"
        check_arch "${HELM_PATH}"
        # kubeval may be skipped on arm64 (no support)
        check_arch "${KUBECONFORM_PATH}"
        check_arch "${CONFTEST_PATH}"
        check_arch "${YQ_PATH}"
        check_arch "${RANCHER_PATH}"
        check_arch "${TILT_PATH}"
        check_arch "${SKAFFOLD_PATH}"
        check_arch "${KUBESCORE_PATH}"
